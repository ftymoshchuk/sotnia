<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sotnia: figures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica:ital@0;1&family=IM+Fell+English+SC&family=Jacquard+24&display=swap" rel="stylesheet">
<style>
  /* The figure sheet: every man, weapon and piece of armour the game can draw, from the same scripts the game loads. Open it from the
     repository (file:// works) after `npm run build`. It is a tool for the artist, not part of the game. */
  :root { --table: #14100c; --walnut: #2a2018; --line: #5b4219; --parchment: #e7ddbf; --cream: #f4edd6; --mute: #b3a784; --gilt: #e8c874; --ink: #14100c; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 36px 40px 60px; background: var(--table); color: var(--parchment); font: 17px/1.4 'IM Fell DW Pica', Georgia, serif; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 32px; margin-bottom: 28px; }
  h1 { margin: 0; font: 400 54px/.95 'Jacquard 24', serif; color: var(--gilt); }
  header p { margin: 0; max-width: 62ch; color: var(--mute); }
  h2 { display: flex; align-items: center; gap: 12px; margin: 38px 0 14px; font: 400 15px/1.1 'IM Fell English SC', serif; letter-spacing: .16em; color: var(--gilt); }
  h2::after { content: ''; flex: 1; height: 2px; background: #3a2d21; }
  .note { margin: -6px 0 14px; color: var(--mute); font-size: 14.5px; max-width: 80ch; }
  .grid { display: flex; flex-wrap: wrap; gap: 14px; }
  figure { margin: 2px; padding: 8px 8px 10px; background: var(--walnut); box-shadow: 0 -2px 0 var(--line), 0 2px 0 var(--line), -2px 0 0 var(--line), 2px 0 0 var(--line); }
  figure canvas { display: block; image-rendering: pixelated; }
  figcaption { margin-top: 8px; font: 400 14px/1.15 'IM Fell English SC', serif; letter-spacing: .05em; color: var(--cream); }
  figcaption small { display: block; margin-top: 3px; font: italic 13px/1.2 'IM Fell DW Pica', serif; letter-spacing: 0; color: var(--mute); }
  .row { display: flex; flex-wrap: wrap; align-items: stretch; gap: 14px; }
  .label { flex: none; width: 100%; font: 400 13px/1 'IM Fell English SC', serif; letter-spacing: .14em; color: var(--gilt); margin: 8px 0 -4px; }
  .price { color: var(--gilt); font-style: normal; font-weight: 700; }
  .flag { display: inline-block; width: 18px; height: 12px; margin-left: 8px; box-shadow: 0 -2px 0 var(--ink), 0 2px 0 var(--ink), -2px 0 0 var(--ink), 2px 0 0 var(--ink); vertical-align: -1px; }
</style>
</head>
<body>
<header>
  <h1>Figures</h1>
  <p>Every man, weapon and piece of armour the game can draw, from the scripts it loads. Figures are drawn at twice the pixels of the scene around them. Each level of weapon and armour, 0 to 3, changes the picture.</p>
</header>
<main id="sheet"></main>

<!-- The same scripts, in the same order, as index.html. -->
<script src="../js/core.js"></script>
<script src="../js/journey.js"></script>
<script src="../js/command.js"></script>
<script src="../js/geo.js"></script>
<script src="../js/art.js"></script>
<script src="../js/figures.js"></script>
<script>
"use strict";
const ZOOM = +(new URLSearchParams(location.search).get('zoom') || 4); // screen pixels to a scene pixel: two to a figure pixel, or ?zoom=6 for three
const PAPER = '#d9d1bc', NIGHT = '#1d2433', CLASSES = ['pike', 'shot', 'sabre'];
const sheet = document.getElementById('sheet');

/** One picture in a frame: a scene w by h scene pixels on the colour bg, with a ground line, and a caption. */
function cell(parent, caption, sub, w, h, bg, draw) {
  const s = sceneCanvas(w, h), g = s.getContext('2d');
  g.fillStyle = bg; g.fillRect(0, 0, w, h);
  g.fillStyle = bg === PAPER ? 'rgba(28,26,23,.4)' : 'rgba(255,255,255,.1)'; g.fillRect(0, h - 3, w, 1);
  draw(g, w, h);
  const cv = document.createElement('canvas'); cv.width = w * ZOOM; cv.height = h * ZOOM;
  const c = cv.getContext('2d'); c.imageSmoothingEnabled = false; c.drawImage(s, 0, 0, cv.width, cv.height);
  const f = document.createElement('figure'); f.appendChild(cv);
  const cap = document.createElement('figcaption'); cap.innerHTML = caption + (sub ? '<small>' + sub + '</small>' : ''); f.appendChild(cap);
  parent.appendChild(f);
}
/** One picture of gear (an image from gearArt, 44 by 32 figure pixels) in a frame, three screen pixels to a figure pixel. */
function cellImg(parent, caption, sub, src) {
  const f = document.createElement('figure'), im = new Image();
  im.src = src; im.width = 44 * ZOOM / 2; im.height = 32 * ZOOM / 2; im.style.cssText = 'display:block;image-rendering:pixelated;background:' + PAPER;
  f.appendChild(im);
  const cap = document.createElement('figcaption'); cap.innerHTML = caption + (sub ? '<small>' + sub + '</small>' : ''); f.appendChild(cap);
  parent.appendChild(f);
}
function section(title, note) {
  const h = document.createElement('h2'); h.textContent = title; sheet.appendChild(h);
  if (note) { const p = document.createElement('p'); p.className = 'note'; p.innerHTML = note; sheet.appendChild(p); }
  const d = document.createElement('div'); d.className = 'grid'; sheet.appendChild(d);
  return d;
}
const man = (o, x) => (g, w, h) => drawSoldier(g, Math.round(w / 2) + (x || 0), h - 3, Object.assign({ skin: 'own', face: 1, mode: 'idle', anim: 0 }, o));

// 1. The ladder: the same man, the weapon and the armour bought together
{
  const d = section('The ladder of kit', 'Arms and armour bought together, level 0 to 3. Left to right is what a man carries as the company grows richer.');
  for (const cls of CLASSES) {
    const row = document.createElement('div'); row.className = 'row'; row.innerHTML = '<div class="label">' + CLS[cls].name + '</div>'; d.appendChild(row);
    for (let lv = 0; lv < 4; lv++) cell(row, WPN[cls][lv], ARM[lv], cls === 'shot' ? 44 : 34, 38, PAPER, man({ cls, wpn: lv, arm: lv, man: lv * 3 + 1 }, cls === 'shot' ? -5 : 0));
  }
}
// 1b. The nations of the company, and the foes who are a people of their own
const flag = label => { const f = flagOf(label); if (!f) return ''; const n = f.length; return '<span class="flag" style="background:linear-gradient(' + f.map((c, i) => c + ' ' + (100 * i / n) + '% ' + (100 * (i + 1) / n) + '%').join(',') + ')"></span>'; };
{
  const d = section('Nations', 'Every man of the company is dressed as his nation, in its colours, and wears the company\u2019s red sash over them. Each is shown in the classes it fields, in the worst kit and in a better.');
  for (const o of ORIGINS) {
    const row = document.createElement('div'); row.className = 'row'; row.innerHTML = '<div class="label">' + o.label + flag(o.label) + '</div>'; d.appendChild(row);
    for (const cls of [...new Set(o.cls)]) for (const lv of [0, 2]) cell(row, CLS[cls].name, ARM[lv], cls === 'shot' ? 44 : 34, 38, PAPER, man({ cls, nation: o.id, wpn: lv, arm: lv, man: 3 + lv }, cls === 'shot' ? -5 : 0));
  }
}
{
  const d = section('Foes of a people of their own', 'Their coat and trim come from their skin, and their legs, caps and marks from their people; they wear no company sash.');
  const row = document.createElement('div'); row.className = 'row'; d.appendChild(row);
  for (const skin of ['swede', 'imperial', 'muscovite', 'tatar', 'croat']) for (const cls of CLASSES) cell(row, skin.charAt(0).toUpperCase() + skin.slice(1), CLS[cls].name, cls === 'shot' ? 44 : 34, 38, PAPER, man({ cls, skin, wpn: 0, arm: 0, face: -1, man: 2 }, cls === 'shot' ? 5 : 0));
}
// 2. The pieces, as the cards show them
{
  const d = section('Arms', 'The four weapons of each class, as the card shows them in the ladder. The price is what it costs to rise to it from the level before.');
  for (const cls of CLASSES) {
    const row = document.createElement('div'); row.className = 'row'; row.innerHTML = '<div class="label">' + CLS[cls].name + '</div>'; d.appendChild(row);
    for (let lv = 0; lv < 4; lv++) cellImg(row, WPN[cls][lv], lv ? '<span class="price">' + GEAR_COST[lv - 1] + '</span> thalers' : 'to start with', gearArt('wpn', cls, lv));
  }
}
{
  const d = section('Armour', 'The same four for every class. The company’s colour is the coat of the linen shirt, and from the buff coat up it is carried by the sleeves and the sash.');
  const row = document.createElement('div'); row.className = 'row'; d.appendChild(row);
  for (let lv = 0; lv < 4; lv++) cellImg(row, ARM[lv], lv ? '<span class="price">' + GEAR_COST[lv - 1] + '</span> thalers' : 'to start with', gearArt('arm', 'pike', lv));
}
// 3. The poses of a fight, at the top level and at the bottom
for (const lv of [0, 3]) {
  const d = section(lv ? 'Poses, in the best kit' : 'Poses, in the worst', 'Standing, walking (two frames), fighting, a blow struck, aiming, the flash of the shot, reloading, routed, and fallen.');
  for (const cls of CLASSES) {
    const row = document.createElement('div'); row.className = 'row'; row.innerHTML = '<div class="label">' + CLS[cls].name + '</div>'; d.appendChild(row);
    const list = cls === 'pike' ? [['stands', {}], ['walks', { moving: true, anim: 0 }], ['walks', { moving: true, anim: 1 }], ['levels the pike', { mode: 'fight' }], ['thrusts', { mode: 'fight', swing: 1 }], ['routs', { mode: 'rout' }], ['falls', { dead: true }]]
      : cls === 'shot' ? [['stands', {}], ['walks', { moving: true, anim: 0 }], ['aims', { mode: 'aim' }], ['fires', { mode: 'aim', flash: 1 }], ['reloads', { mode: 'reload', t: 0 }], ['clubs', { mode: 'fight' }], ['routs', { mode: 'rout' }], ['falls', { dead: true }]]
      : [['stands', {}], ['walks', { moving: true, anim: 0 }], ['guards', { mode: 'fight' }], ['cuts', { mode: 'fight', swing: 1 }], ['routs', { mode: 'rout' }], ['falls', { dead: true }]];
    for (const [name, o] of list) cell(row, name, '', cls === 'pike' ? 44 : 50, 38, PAPER, man(Object.assign({ cls, wpn: lv, arm: lv, man: 11 }, o), cls === 'pike' && o.mode === 'fight' ? -8 : cls === 'shot' && (o.mode === 'aim' || o.mode === 'fight') ? -6 : 0));
  }
}
// 4. The camp
{
  const d = section('In camp', 'Sitting on a log (with a bandura, a pipe, or nothing), abed, foraging, bandaged, and the four posts of the command as the camp draws them when it knows no more of the man.');
  const row = document.createElement('div'); row.className = 'row'; d.appendChild(row);
  const camper = o => (g, w, h) => drawCamper(g, Math.round(w / 2), h - 3, Object.assign({ skin: 'own', face: 1 }, o));
  for (const [name, o] of [['sits', { cls: 'sabre', pose: 'sit', arm: 1, man: 2 }], ['plays', { cls: 'sabre', pose: 'sit', prop: 'bandura', arm: 2, man: 6 }], ['smokes', { cls: 'pike', pose: 'sit', prop: 'pipe', arm: 3, man: 9 }], ['abed', { cls: 'shot', pose: 'lie', arm: 2 }], ['forages', { cls: 'pike', pose: 'forage', anim: 0 }], ['bandaged', { cls: 'shot', bandage: true, arm: 1, wpn: 1 }]])
    cell(row, name, '', 32, 38, NIGHT, camper(o));
  for (const k of ['surgeon', 'drill', 'qm', 'chaplain']) cell(row, STAFF[k].name, '', 32, 38, NIGHT, (g, w, h) => drawCivilian(g, Math.round(w / 2), h - 3, k, 1));
}
// 4b. The command: the captains, the officers of each post, the retainers
{
  const d = section('The command', 'The captain stands apart from the line, in the dress of his nation and gilt where the men wear red. Each kind of officer is told by his coat, his hat and what he carries; a retainer likewise.');
  const r1 = document.createElement('div'); r1.className = 'row'; d.appendChild(r1);
  for (const [id, c] of Object.entries(CAPTAINS)) cell(r1, c.title, c.perk.name + ' / ' + c.flaw.name, 34, 40, NIGHT, (g, w, h) => drawCamper(g, Math.round(w / 2), h - 3, { cls: c.cls, skin: 'own', face: 1, mode: 'idle', wpn: 2, arm: 2, man: id.length, nation: c.origin, rank: 'captain' }));
  for (const k of STATIONS) {
    const r = document.createElement('div'); r.className = 'row'; d.appendChild(r);
    for (const kind of Object.keys(SPECIALTIES).filter(x => SPECIALTIES[x].station === k)) cell(r, SPECIALTIES[kind].title, STAFF[k].name, 34, 40, NIGHT, (g, w, h) => drawPerson(g, Math.round(w / 2), h - 3, OFFICER_LOOK[kind], 1));
  }
  const r2 = document.createElement('div'); r2.className = 'row'; d.appendChild(r2);
  for (const [id, t] of Object.entries(RETAINERS)) cell(r2, t.title, 'retainer', 34, 40, NIGHT, (g, w, h) => drawPerson(g, Math.round(w / 2), h - 3, RETAINER_LOOK[id], 1));
}
// 5. The liveries
{
  const d = section('Liveries', 'The colours that say whose man he is: the company in madder, and the foes the company meets.');
  const row = document.createElement('div'); row.className = 'row'; d.appendChild(row);
  for (const skin of Object.keys(SKINS)) cell(row, skin, '', 34, 38, PAPER, man({ cls: 'shot', skin, wpn: 1, arm: 1, face: -1, man: skin.length }));
}
</script>
</body>
</html>
