# What a pull request has to pass before it merges. The branch ruleset
# (docs/default-branch.ruleset.json) requires one check, `ci-passed`, the last
# job here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # The game is plain scripts with no build step, so a script that does not
      # parse ships as a blank page.
      - name: Every script parses
        run: for f in js/*.js; do node --check "$f"; done
      # Node's own test runner: the repository has no npm dependencies to install.
      - name: Tests
        run: node --test tests/*.test.js

  # One check to require on main, so adding a job above does not mean editing
  # the branch ruleset to match.
  ci-passed:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
