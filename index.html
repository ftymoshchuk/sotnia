<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sotnia Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;1,400&family=Alegreya+SC:wght@400;500&family=Grenze+Gotisch:wght@600;900&display=swap" rel="stylesheet">
<style>
:root {
  /* A printed muster roll: ink-heavy masthead, ruled ledger rows, and the fight shown as a hand-coloured woodcut in coarse pixels. */
  --paper: #d9d1bc;
  --paper-lo: #cdc4ab;
  --paper-hi: #e6dfcc;
  --ink: #1c1a17;
  --ink-soft: #57524a;
  --madder: #9c1f2e;
  --woad: #2d4b70;
  --weld: #b98a2b;
  --display: 'Grenze Gotisch', 'Old English Text MT', Georgia, serif;
  --body: 'Alegreya', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --caps: 'Alegreya SC', 'Alegreya', Georgia, serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--ink); color: var(--ink); font: 17px/1.42 var(--body); -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; }
h1, h2, h3, p, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
img { max-width: 100%; }

.sheet { max-width: 1140px; min-height: 100%; margin: 0 auto; background: var(--paper); padding: 0 clamp(16px, 3vw, 34px) 30px; display: flex; flex-direction: column; gap: 18px; }

/* ---------- masthead ---------- */
.mast { border-bottom: 5px double var(--ink); padding: 14px 0 12px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 22px; }
.mast h1 { font: 900 clamp(46px, 8vw, 76px)/0.82 var(--display); letter-spacing: 0.01em; }
.mast h1 b { color: var(--madder); font-weight: 900; }
.strap { font: 15px/1.2 var(--caps); letter-spacing: 0.09em; flex: 1 1 220px; padding-bottom: 6px; }
.tools { display: flex; gap: 8px; padding-bottom: 4px; }

.ledger { display: flex; flex-wrap: wrap; background: var(--ink); color: var(--paper); }
.ledger > div { padding: 8px 16px 9px; border-right: 1px solid #ffffff22; display: flex; flex-direction: column; gap: 1px; min-width: 96px; flex: 1 1 96px; }
.ledger .k { font: 12.5px/1 var(--caps); letter-spacing: 0.12em; opacity: 0.72; }
.ledger .v { font: 600 25px/1.05 var(--body); font-variant-numeric: lining-nums tabular-nums; }
.ledger .v small { font: 13.5px var(--body); opacity: 0.72; margin-left: 5px; }
.ledger .days { flex: 2 1 260px; }
.ticks { display: flex; gap: 2px; margin-top: 5px; }
.ticks i { flex: 1; height: 7px; background: #ffffff26; }
.ticks i.done { background: var(--paper); }
.ticks i.now { background: var(--weld); }
.ticks i.end { background: var(--madder); }

/* ---------- controls ---------- */
.btn { border: 2px solid var(--ink); background: var(--ink); color: var(--paper); font: 15px/1 var(--caps); letter-spacing: 0.09em; padding: 9px 14px 10px; cursor: pointer; border-radius: 0; text-align: center; }
.btn:hover:not(:disabled) { background: var(--madder); border-color: var(--madder); }
.btn.go { background: var(--madder); border-color: var(--madder); }
.btn.go:hover:not(:disabled) { background: var(--ink); border-color: var(--ink); }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.ghost:hover:not(:disabled) { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.sm { font-size: 13.5px; padding: 6px 10px 7px; border-width: 1.5px; }
.btn.big { font-size: 18px; padding: 13px 22px 14px; }
.btn:disabled { opacity: 0.38; cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--woad); outline-offset: 2px; }

.seg { display: inline-flex; border: 1.5px solid var(--ink); }
.seg button { border: 0; background: transparent; font: 13.5px/1 var(--caps); letter-spacing: 0.08em; padding: 7px 10px 8px; cursor: pointer; border-right: 1.5px solid var(--ink); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.seg button:hover:not([aria-pressed="true"]):not(:disabled) { background: var(--paper-lo); }
.seg button:disabled { opacity: 0.4; cursor: not-allowed; }

.bar { display: block; height: 7px; border: 1px solid var(--ink); background: var(--paper-hi); }
.bar i { display: block; height: 100%; background: var(--madder); }
.bar.mo i { background: var(--woad); }
.bar.xp i { background: var(--weld); }

.tag { display: inline-block; font: 12.5px/1 var(--caps); letter-spacing: 0.1em; padding: 3px 6px 4px; border: 1px solid var(--ink); white-space: nowrap; }
.tag.red { background: var(--madder); border-color: var(--madder); color: var(--paper-hi); }
.tag.ink { background: var(--ink); color: var(--paper); }
.tag.gold { background: var(--weld); border-color: var(--weld); color: var(--ink); }

.head { background: var(--ink); color: var(--paper); font: 14px/1 var(--caps); letter-spacing: 0.14em; padding: 8px 12px 9px; display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.head span { opacity: 0.75; letter-spacing: 0.06em; }
.spr { image-rendering: pixelated; image-rendering: crisp-edges; width: 32px; height: 62px; flex: none; align-self: flex-end; }
.muted { color: var(--ink-soft); }
.num { font-variant-numeric: lining-nums tabular-nums; }

/* ---------- camp ---------- */
.camp { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.news { border: 1.5px solid var(--ink); border-left-width: 7px; padding: 9px 13px; font-style: italic; }
.news li + li { margin-top: 2px; }

.man { border-bottom: 1px solid var(--ink); display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 10px; }
.man-head { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 7px 4px 7px 6px; cursor: pointer; text-align: left; min-width: 0; }
.man-head:hover { background: var(--paper-lo); }
.man-id { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.man-name { font: 600 18.5px/1.1 var(--body); display: flex; flex-wrap: wrap; gap: 4px 7px; align-items: center; }
.man-sub { font: 14.5px/1.15 var(--body); color: var(--ink-soft); }
.man-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; max-width: 250px; }
.lab { font: 12px/1 var(--caps); letter-spacing: 0.1em; color: var(--ink-soft); display: flex; flex-direction: column; gap: 3px; }
.man .seg { margin-right: 4px; }
.man-body { grid-column: 1 / -1; background: var(--paper-hi); border-top: 1px dashed var(--ink); padding: 11px 13px 13px; display: grid; gap: 10px; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 20px; font-variant-numeric: lining-nums tabular-nums; }
.stats b { font: 12.5px var(--caps); letter-spacing: 0.1em; color: var(--ink-soft); margin-right: 5px; font-weight: 400; }
.rowline { display: flex; flex-wrap: wrap; gap: 7px 10px; align-items: center; }
.rowline .grow { flex: 1 1 160px; }
.empty { padding: 16px 8px; font-style: italic; color: var(--ink-soft); }

.tabs { display: flex; border-bottom: 3px solid var(--ink); gap: 3px; flex-wrap: wrap; }
.tabs button { border: 1.5px solid var(--ink); border-bottom: 0; background: transparent; font: 14px/1 var(--caps); letter-spacing: 0.12em; padding: 9px 13px 8px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); }
.tabs button:hover:not([aria-selected="true"]) { background: var(--paper-lo); }
.panel { display: grid; gap: 12px; padding-top: 13px; }

.notice { border: 1.5px solid var(--ink); padding: 11px 13px 12px; display: grid; gap: 7px; background: var(--paper-hi); }
.notice.final { border-width: 4px; border-style: double; }
.notice h3 { font: 600 25px/1.02 var(--display); letter-spacing: 0.01em; text-wrap: balance; }
.notice .who { font: 13px/1.1 var(--caps); letter-spacing: 0.1em; color: var(--ink-soft); }
.notice p { font-size: 16px; line-height: 1.36; }
.foes { display: flex; flex-wrap: wrap; gap: 3px 13px; align-items: flex-end; }
.foe { display: flex; align-items: flex-end; gap: 4px; font: 14.5px/1.1 var(--body); padding-bottom: 1px; }
.foe .spr { width: 24px; height: 46px; }
.terms { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; border-top: 1px dashed var(--ink); padding-top: 8px; }
.terms .pay { font: 600 21px/1 var(--body); font-variant-numeric: lining-nums; }
.terms .btn { margin-left: auto; }

.offer { display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--ink); padding: 6px 2px 8px; }
.offer .what { flex: 1; min-width: 0; }
.offer .what b { font-weight: 600; font-size: 18px; }
.offer .what div { font-size: 14.5px; color: var(--ink-soft); line-height: 1.25; }
.log li { border-bottom: 1px dotted var(--ink-soft); padding: 5px 0; display: flex; gap: 10px; font-size: 16px; line-height: 1.3; }
.log .d { font: 12.5px/1.7 var(--caps); letter-spacing: 0.08em; color: var(--ink-soft); flex: none; width: 46px; }

.daybar { border-top: 5px double var(--ink); padding-top: 13px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; }
.daybar p { flex: 1 1 280px; font-size: 16px; }

/* ---------- muster ---------- */
.muster { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.pickrow { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; border-bottom: 1px solid var(--ink); background: none; padding: 6px; text-align: left; cursor: pointer; }
.pickrow:hover:not(:disabled) { background: var(--paper-lo); }
.pickrow[aria-pressed="true"] { background: var(--paper-hi); box-shadow: inset 7px 0 0 var(--madder); padding-left: 14px; }
.pickrow:disabled { opacity: 0.5; cursor: not-allowed; }
.pickrow .spr { width: 26px; height: 50px; }
.pickrow .box { width: 20px; height: 20px; border: 2px solid var(--ink); flex: none; display: grid; place-items: center; font: 700 15px/1 var(--body); }
.pickrow[aria-pressed="true"] .box { background: var(--ink); color: var(--paper); }
.stances { display: grid; gap: 7px; }
.stance { display: grid; grid-template-columns: auto 1fr auto; gap: 3px 12px; align-items: center; border: 1.5px solid var(--ink); background: none; padding: 9px 12px 10px; text-align: left; cursor: pointer; }
.stance b { font: 600 23px/1 var(--display); }
.stance span { font-size: 15px; line-height: 1.25; color: var(--ink-soft); }
.stance[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.stance[aria-pressed="true"] span { color: var(--paper); opacity: 0.8; }
.stance[aria-pressed="true"] .tag { border-color: var(--paper); }
.stance:hover:not([aria-pressed="true"]) { background: var(--paper-lo); }

/* ---------- the field ---------- */
.plate { border: 3px solid var(--ink); background: var(--paper); position: relative; line-height: 0; }
.plate canvas { display: block; width: 100%; aspect-ratio: 300 / 124; image-rendering: pixelated; image-rendering: crisp-edges; }
.caption { font: italic 15.5px/1.3 var(--body); padding: 6px 2px 0; display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.verdict { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; background: #d9d1bca3; line-height: 1.1; text-align: center; padding: 12px; }
.verdict h2 { font: 900 clamp(34px, 7vw, 68px)/0.9 var(--display); }
.verdict.lost h2 { color: var(--madder); }
.cmd { display: flex; flex-wrap: wrap; gap: 9px 14px; align-items: center; }
.cmd .seg button { font-size: 15px; padding: 10px 14px 11px; }
.cmd .spacer { flex: 1; }
.sides { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 5px 10px; padding-top: 8px; }
.chip { font: 14.5px/1.1 var(--body); display: grid; gap: 2px; }
.chip.out { opacity: 0.42; text-decoration: line-through; }
.blog { min-height: 104px; }
.blog li { font-size: 15.5px; line-height: 1.3; padding: 2px 0; border-bottom: 1px dotted var(--ink-soft); }
.blog li.bad { color: var(--madder); }

/* ---------- reports, title, end ---------- */
.report { display: grid; gap: 16px; max-width: 760px; }
.bigword { font: 900 clamp(40px, 8vw, 74px)/0.9 var(--display); text-wrap: balance; }
.bigword.bad { color: var(--madder); }
.bill li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 14px; align-items: center; border-bottom: 1px solid var(--ink); padding: 6px 2px; }
.bill small { display: block; color: var(--ink-soft); font-size: 14.5px; }
.sum { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 18px; }
.sum b { font-weight: 600; }

.title-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.lede { font-size: 20px; line-height: 1.36; }
.lede::first-letter { font: 900 62px/0.78 var(--display); float: left; padding: 5px 8px 0 0; color: var(--madder); }
.how { display: grid; gap: 9px; counter-reset: how; }
.how li { display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: baseline; counter-increment: how; }
.how li::before { content: counter(how); font: 900 30px/0.9 var(--display); }
.how b { font-weight: 600; }
.stack { display: grid; gap: 14px; }

.veil { position: fixed; inset: 0; background: #1c1a17b8; display: grid; place-items: center; padding: 16px; z-index: 20; overflow: auto; }
.card { background: var(--paper); border: 3px solid var(--ink); outline: 1px solid var(--ink); outline-offset: 3px; max-width: 560px; width: 100%; padding: 18px 20px 20px; display: grid; gap: 12px; }
.card h2 { font: 900 36px/0.95 var(--display); text-wrap: balance; }
.card .choice { display: grid; gap: 2px; text-align: left; border: 1.5px solid var(--ink); background: none; padding: 9px 12px 10px; cursor: pointer; }
.card .choice:hover { background: var(--ink); color: var(--paper); }
.card .choice b { font-weight: 600; font-size: 18px; }
.card .choice span { font-size: 15px; opacity: 0.8; }
.rules { display: grid; gap: 8px; font-size: 16px; }
.rules b { font-weight: 600; }
.foot { font-size: 14px; color: var(--ink-soft); border-top: 1px solid var(--ink); padding-top: 9px; margin-top: auto; }

@media (max-width: 860px) {
  .camp, .muster, .title-grid { grid-template-columns: minmax(0, 1fr); }
  .sides { grid-template-columns: 1fr; }
}
@media (max-width: 520px) {
  body { font-size: 16px; }
  .man { grid-template-columns: minmax(0, 1fr); }
  .man > .seg { margin: 0 0 8px 48px; justify-self: start; }
  .ledger > div { padding: 7px 10px 8px; min-width: 76px; flex-basis: 76px; }
  .ledger .v { font-size: 21px; }
  .terms .btn { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="sheet" id="view"></div>
<div id="modal"></div>
<script>
"use strict";
/* ===== SOTNIA core rules: no DOM in this block ===== */
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const chance = p => Math.random() < p;

const DAYS = 24;
const ROSTER_MAX = 8;

const CLS = {
  pike:  { name: 'Pikeman',   skill: 'Pike',  vig: 66, mel: 9,  aim: 0, grd: 7, spd: 15, reach: 19, cd: 1.5,  dmg: [9, 14], arm: 3 },
  shot:  { name: 'Musketeer', skill: 'Aim',   vig: 48, mel: 5,  aim: 9, grd: 4, spd: 17, reach: 8,  cd: 1.3,  dmg: [4, 7],  arm: 0 },
  sabre: { name: 'Sabreur',   skill: 'Blade', vig: 55, mel: 11, aim: 0, grd: 9, spd: 27, reach: 9,  cd: 0.85, dmg: [7, 11], arm: 1 }
};
const WPN = {
  pike:  ['Ash pike', 'Ironbound pike', 'Partisan', "Master's halberd"],
  shot:  ['Old arquebus', 'Matchlock musket', 'Dutch musket', 'Wheel-lock'],
  sabre: ['Notched sabre', 'Hungarian sabre', 'Karabela', 'Damascened sabre']
};
const ARM = ['Linen shirt', 'Buff coat', 'Breastplate', 'Cuirass and tassets'];
const GEAR_COST = [22, 40, 65];
const TIER = ['rabble', 'trained', 'veteran', 'elite'];
const COST = [0.5, 1, 1.6, 2.4];

const ORIGINS = [
  { id: 'cossack', label: 'Zaporozhian', cls: ['sabre', 'sabre', 'shot'],
    first: ['Ostap', 'Taras', 'Danylo', 'Maksym', 'Pavlo', 'Hryts', 'Semen', 'Fedir'],
    last: ['Vovk', 'Shram', 'Bily', 'Chorny', 'Holota', 'Kryvy', 'Zaliznyi', 'Perebyinis'] },
  { id: 'pole', label: 'Polish', cls: ['sabre', 'pike', 'sabre'],
    first: ['Jan', 'Stanisław', 'Wojciech', 'Mikołaj', 'Jędrzej', 'Kacper', 'Paweł', 'Marcin'],
    last: ['Wilk', 'Sokół', 'Żuraw', 'Lis', 'Dąb', 'Bystry', 'Gozdawa', 'Zaręba'] },
  { id: 'german', label: 'German', cls: ['pike', 'shot', 'pike'],
    first: ['Hans', 'Jörg', 'Kaspar', 'Matthias', 'Ulrich', 'Veit', 'Konrad', 'Lorenz'],
    last: ['Schwarz', 'Lang', 'Kohl', 'Eisen', 'Roth', 'Krumm', 'Hartung', 'Vogel'] },
  { id: 'swede', label: 'Swedish', cls: ['shot', 'pike', 'shot'],
    first: ['Lars', 'Nils', 'Erik', 'Olof', 'Per', 'Anders', 'Sven', 'Mats'],
    last: ['Björn', 'Stål', 'Ek', 'Storm', 'Lind', 'Berg', 'Hjort', 'Falk'] },
  { id: 'scot', label: 'Scottish', cls: ['pike', 'shot', 'pike'],
    first: ['Angus', 'Duncan', 'Hamish', 'Robert', 'Ewan', 'Alasdair', 'Colin', 'Gavin'],
    last: ['Ross', 'Sinclair', 'Gordon', 'Hay', 'Innes', 'Forbes', 'Keith', 'Ramsay'] },
  { id: 'magyar', label: 'Hungarian', cls: ['sabre', 'shot', 'sabre'],
    first: ['István', 'Miklós', 'János', 'Gergely', 'Bálint', 'Mátyás', 'Ferenc', 'András'],
    last: ['Nagy', 'Kis', 'Farkas', 'Vörös', 'Fekete', 'Szabó', 'Varga', 'Balogh'] },
  { id: 'croat', label: 'Croat', cls: ['sabre'],
    first: ['Ivo', 'Marko', 'Luka', 'Josip', 'Stjepan', 'Petar'],
    last: ['Babić', 'Jurić', 'Knežević', 'Horvat', 'Marić', 'Kovač'] },
  { id: 'tatar', label: 'Lipka Tatar', cls: ['sabre'],
    first: ['Aslan', 'Murad', 'Selim', 'Kerim', 'Dawid', 'Adam'],
    last: ['Assan', 'Murza', 'Ułan', 'Bohdan', 'Alej', 'Tuhan'] }
];

const TRAITS = {
  'Steadfast':  { good: true,  desc: 'Never breaks and runs.' },
  'Keen-eyed':  { good: true,  desc: 'Shoots straighter than his fellows.' },
  'Brawler':    { good: true,  desc: 'Hits harder in the press.' },
  'Fleet':      { good: true,  desc: 'Covers ground quickly.' },
  'Hardy':      { good: true,  desc: 'Takes more killing than most.' },
  'Lucky':      { good: true,  desc: 'Tends to survive what should kill him.' },
  'Skittish':   { good: false, desc: 'Runs sooner than the others.' },
  'Grasping':   { good: false, desc: 'Wants two thalers more a day.' }
};

const SCARS = [
  { label: 'a ruined hand', fn: s => { if (s.cls === 'shot') s.aim = Math.max(1, s.aim - 2); else s.mel = Math.max(1, s.mel - 2); } },
  { label: 'a limp', fn: s => { s.grd = Math.max(1, s.grd - 2); } },
  { label: 'a rib that never set', fn: s => { s.vig = Math.max(24, s.vig - 6); s.hp = Math.min(s.hp, s.vig); } },
  { label: 'one eye', fn: s => { if (s.cls === 'shot') s.aim = Math.max(1, s.aim - 3); else s.grd = Math.max(1, s.grd - 1); } }
];

const STAFF = {
  surgeon:  { name: 'Barber-surgeon', fee: 40, wage: 2, desc: 'Rest heals faster. Men struck down die less often.' },
  drill:    { name: 'Drillmaster',    fee: 45, wage: 2, desc: 'A day of drill teaches half as much again.' },
  qm:       { name: 'Quartermaster',  fee: 30, wage: 1, desc: 'The company eats a quarter less. Market prices fall 15%.' },
  chaplain: { name: 'Field chaplain', fee: 25, wage: 1, desc: 'Spirits rise a little every day.' }
};

/* ---------- soldiers ---------- */
function applyPromo(s, k) {
  if (k === 'vig') { s.vig += 8; s.hp = Math.min(s.vig, (s.hp || 0) + 8); }
  else if (k === 'skill') { if (s.cls === 'shot') s.aim += 2; else s.mel += 2; }
  else s.grd += 2;
}
function makeSoldier(st, cls, level, origin) {
  origin = origin || pick(ORIGINS.filter(o => o.cls.includes(cls)));
  const c = CLS[cls];
  const s = {
    id: st.nextId++, name: pick(origin.first) + ' ' + pick(origin.last), origin: origin.label, cls,
    level: 1, xp: 0, vig: c.vig + ri(-4, 4), mel: c.mel + ri(-1, 1), aim: c.aim ? c.aim + ri(-1, 1) : 0,
    grd: c.grd + ri(-1, 1), wpn: 0, arm: 0, morale: ri(55, 72), trait: null, order: 'drill',
    wound: 0, kills: 0, promos: 0, scars: [], fought: false
  };
  if (chance(0.6)) s.trait = pick(Object.keys(TRAITS));

  if (s === 'hold') for (const u of b.units) if (u.side === 0) { u.hx = u.x; u.hy = u.y; }
  paintHud();
}
function act(a, d) {
  wake();
  switch (a) {
    case 'new': G = newGame(); ui.screen = 'camp'; ui.tab = 'contracts'; ui.open = null; ui.news = null; ui.modal = null; break;
    case 'continue': { const s = loadSave(); if (s) { G = s; ui.screen = 'camp'; ui.news = null; if (G.pending && G.pending.id) ui.modal = { type: 'event' }; } break; }
    case 'tab': ui.tab = d.k; break;
    case 'open': ui.open = ui.open === +d.id ? null : +d.id; break;
    case 'order': { const s = man(+d.id); if (s) s.order = d.o; break; }
    case 'promo': promote(G, +d.id, d.k); G.odds = {}; break;
    case 'up': upgrade(G, +d.id, d.k); break;
    case 'dismiss': dismiss(G, +d.id); ui.open = null; break;
    case 'hire': hire(G, +d.i); break;
    case 'buy': buy(G, d.k); break;
    case 'staff': hireStaff(G, d.k); break;
    case 'muster': { const c = G.contracts.find(x => x.id === +d.id); if (!c) return; ui.c = c; ui.pick = defaultPick(G, c); ui.stance = null; ui.screen = 'muster'; queueOdds(); break; }
    case 'pick': {
      const id = +d.id, i = ui.pick.indexOf(id);
      if (i >= 0) ui.pick.splice(i, 1); else if (ui.c.cap === 1) ui.pick = [id]; else if (ui.pick.length < ui.c.cap) ui.pick.push(id); else return;
      queueOdds(); break;
    }
    case 'stance': ui.stance = d.s; break;
    case 'back': ui.screen = 'camp'; break;
    case 'fight': {
      if (!ui.pick.length) return;
      ui.b = battleFor(G, ui.c, ui.pick, ui.stance || (ui.odds ? ui.odds.best : 'advance'), true);
      ui.speed = 1; ui.overT = 0; ui.verdict = false; acc = 0; ui.screen = 'battle'; sfx('drum'); break;
    }
    case 'cmd': setStance(d.s); return;
    case 'retreat': if (ui.b) { orderRetreat(ui.b); paintHud(); } return;
    case 'speed': ui.speed = +d.v; paintHud(); return;
    case 'report': if (!ui.b || !ui.b.over) return; ui.rep = resolveBattle(G, ui.c, ui.b); ui.b = null; ui.screen = 'report'; break;
    case 'camp': if (G.over) ui.screen = 'end'; else nightfall(); break;
    case 'endday': nightfall(); break;
    case 'choice': { const e = EVENTS.find(x => x.id === (G.pending && G.pending.id)); const res = applyEvent(G, +d.i); ui.modal = { type: 'result', title: e ? e.title : '', text: res }; break; }
    case 'close': { const was = ui.modal; ui.modal = null; if (was && was.type === 'help') { renderModal(); return; } break; }
    case 'help': ui.modal = { type: 'help', prev: ui.modal }; renderModal(); return;
    case 'sound': {
      ui.sound = !ui.sound; try { localStorage.setItem('sotnia-sound', ui.sound ? 'on' : 'off'); } catch (e) { /* fine */ }
      document.querySelectorAll('[data-act="sound"]').forEach(el => { el.textContent = 'Sound ' + (ui.sound ? 'on' : 'off'); });
      if (ui.sound) wake(); return;
    }
    case 'music': {
      ui.music = !ui.music; try { localStorage.setItem('sotnia-music', ui.music ? 'on' : 'off'); } catch (e) { /* fine */ }
      document.querySelectorAll('[data-act="music"]').forEach(el => { el.textContent = 'Music ' + (ui.music ? 'on' : 'off'); });
      if (ui.music) { wake(); setCue(cueForScreen()); } else setCue(null);
      return;
    }
    case 'disband': G.over = 'dissolved'; ui.screen = 'end'; break;
    default: return;
  }
  render();
}
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && !el.disabled) act(el.dataset.act, el.dataset); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.modal && ui.modal.type === 'help') { act('close', {}); return; }
  if (ui.screen !== 'battle' || ui.modal || !ui.b) return;
  const k = { '1': 'hold', '2': 'advance', '3': 'charge' }[e.key];
  if (k && !(ui.c.duel && k === 'hold')) setStance(k);
  else if (e.key === ' ' && !(e.target.closest && e.target.closest('button'))) { e.preventDefault(); ui.speed = ui.speed ? 0 : 1; paintHud(); }
});
window.addEventListener('resize', () => { if (ui.view) fitView(ui.view); });
document.addEventListener('visibilitychange', () => { if (AC) setCue(document.hidden ? null : cueForScreen()); });

/* ---------- the loop ---------- */
const STEP = 1 / 30;
const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000 || 0); last = now;
  const v = ui.view; if (!v) return;
  if (ui.screen === 'battle' && ui.b) {
    const b = ui.b, sp = ui.modal ? 0 : ui.speed;
    if (!b.over && sp > 0) { acc += dt * sp; while (acc >= STEP) { stepBattle(b, STEP); acc -= STEP; } }
    drainFx(v, b, true); stepParts(v, dt * (sp || 0)); if (b.over) stepParts(v, dt);
    drawField(v, b, now / 1000);
    hudT -= dt; if (hudT <= 0) { hudT = 0.15; paintHud(); }
    if (b.over && !ui.verdict) { setCue(null); ui.overT += dt; if (ui.overT > 1.1) { ui.verdict = true; paintHud(); showVerdict(); } }
  } else if (ui.screen === 'title' && ui.demo && !calm) {
    const b = ui.demo;
    if (!b.over) { acc += dt; while (acc >= STEP) { stepBattle(b, STEP); acc -= STEP; } }
    else { demoWait += dt; if (demoWait > 3.5) { newDemo(); return; } }
    drainFx(v, b, false); stepParts(v, dt); drawField(v, b, now / 1000);
  }
}

/* ---------- boot ---------- */
function start(data) {
  if (data && data.G && data.G.v === 1) { G = data.G; ui.screen = G.over ? 'end' : 'camp'; }
  render();
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.load) document.fonts.load("12px 'Alegreya SC'").catch(() => {});
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => (G && ui.screen !== 'title' ? { G } : {}));
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});

</script>
